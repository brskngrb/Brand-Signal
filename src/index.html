<dialog id="settings"><div class="dialog-head"><h2>外觀設定</h2><button class="icon-button" id="settings-close" aria-label="關閉設定">×</button></div><p>拖曳色餅調整主色，整頁配色會同步更新。</p><div class="wheel-wrap"><canvas id="color-wheel" width="280" height="280" aria-label="拖曳色餅選擇色相與飽和度"></canvas><span id="wheel-cursor"></span></div><div class="wheel-controls"><label for="brightness">明亮度</label><input id="brightness" type="range" min="0" max="100" value="100"><label for="wheel-hex">HEX</label><input id="wheel-hex" class="hex-input" maxlength="7" spellcheck="false" aria-describedby="wheel-error"><small id="wheel-error" hidden>請輸入 #RGB 或 #RRGGBB</small></div><div class="text-size"><label for="text-size">字型大小</label><output id="text-size-value" for="text-size">100%</output><input id="text-size" type="range" min="90" max="125" step="5" value="100"></div><div class="color-actions"><button class="button secondary" id="reset-colors">恢復預設</button><button class="button primary" id="finish-colors">完成</button></div><small class="color-hint">外觀設定會保存在此瀏覽器。</small></dialog>
